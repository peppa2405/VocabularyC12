<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tổng hợp từ vựng C1&2 theo chủ đề</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Lora:wght@600;700&family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  /* Bảng màu My Melody Aesthetic */
  --surface: rgba(255, 255, 255, 0.85); 
  --surface-2: rgba(255, 240, 245, 0.95); 
  --ink: #4a4a4a; 
  --muted: #8e8e8e; 
  --line: rgba(255, 182, 193, 0.7); 
  --focus: #ff8fb3; 
  --focus-hover: #ff6b9a; 
  
  --syn: #7bc4c4; 
  --ant: #ff9a9e; 
  
  --c-change: #8bbce6; --c-tech: #b4aee8; --c-pv: #f4a261; --c-col: #d4a5a5; --c-idiom: #e09fbe; --c-wf: #a3c4bc;

  --font-body: "Quicksand", "Nunito", sans-serif;
  --font-head: "Quicksand", "Nunito", sans-serif;
}

html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 130px); scroll-behavior: smooth; }
*, *::before, *::after { box-sizing: inherit; }

body {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  background: url('https://images4.alphacoders.com/695/thumb-1920-695500.png') no-repeat center center fixed;
  background-size: cover;
}

body::after {
  content: "";
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255, 240, 245, 0.15);
  pointer-events: none;
  z-index: -1;
}

.melody-widget {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  transform: scale(0.65); 
  transform-origin: bottom right;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 15px 35px rgba(255, 143, 179, 0.4);
  animation: floatWidget 4s ease-in-out infinite;
}

@keyframes floatWidget {
  0%, 100% { transform: scale(0.65) translateY(0); }
  50% { transform: scale(0.65) translateY(-12px); }
}

a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 12px;}

header.top { 
  max-width: 1360px; 
  margin: 10px auto 0; 
  padding: 12px 18px; 
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 24px;
  background: var(--surface);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-radius: 16px; 
  border: 2px solid rgba(255, 255, 255, 0.9);
  box-shadow: 0 5px 16px rgba(74, 74, 74, 0.08); 
}
.header-copy { flex: 1 1 280px; min-width: 0; }
header.top h1 { 
  font-family: var(--font-head); 
  font-size: 1.4rem; 
  font-weight: 800; 
  line-height: 1.2; 
  margin: 0; 
  color: var(--focus-hover); 
  text-shadow: none;
}
.legend { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 3px; font-size: .76rem; color: var(--muted); font-weight: 700; }
.legend span b { color: var(--focus-hover); }

.bar-in { flex: 2 1 600px; min-width: 0; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }

/* CSS Dropdown Menu */
.dropdown-wrapper { 
  position: relative; 
  display: inline-block; 
}
.topics-btn { 
  font: inherit; font-size: .95rem; font-weight: 800; 
  padding: 8px 20px; 
  border-radius: 20px; 
  border: 2px solid rgba(255, 182, 193, 0.6); 
  background: var(--focus); 
  color: #fff; 
  cursor: pointer; 
  transition: all 0.3s ease; 
  box-shadow: 0 4px 12px rgba(255, 143, 179, 0.3); 
  display: flex;
  align-items: center;
  gap: 8px;
}
.topics-btn:hover { background: var(--focus-hover); transform: translateY(-2px); }
.topics-btn svg { transition: transform 0.2s ease; }
.topics-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.topics-dropdown {
  display: none;
  position: absolute;
  top: 115%;
  left: 0;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  min-width: 280px;
  border-radius: 18px;
  border: 2px solid rgba(255, 182, 193, 0.6);
  box-shadow: 0 10px 25px rgba(255, 182, 193, 0.25);
  padding: 8px;
  z-index: 100;
  flex-direction: column;
  gap: 6px;
  max-height: 60vh;
  overflow-y: auto;
}
.topics-dropdown.show { display: flex; }
.topics-dropdown button {
  width: 100%;
  text-align: left;
  font: inherit;
  font-size: .9rem;
  font-weight: 700;
  padding: 10px 14px;
  border-radius: 12px;
  border: none;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.2s ease;
}
.topics-dropdown button:hover { background: var(--surface-2); color: var(--focus-hover); }
.topics-dropdown button[aria-pressed="true"] { background: var(--surface-2); color: var(--focus-hover); font-weight: 800; }

.nav { flex: 1 1 400px; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; margin-left: 0; padding-left: 12px; border-left: 1px solid var(--line); }
.nav a { 
  text-decoration: none; font-size: .82rem; font-weight: 700; 
  padding: 5px 10px; border-radius: 9px; 
  border: 1px solid rgba(255, 182, 193, 0.35); color: var(--ink); 
  background: rgba(255,255,255,0.75); 
  transition: all 0.2s ease; 
}
.nav a:hover { border-color: var(--c); color: var(--c); background: #fff; transform: translateY(-1px); }

.view-tabs { display: flex; flex: 0 0 auto; gap: 4px; margin: 0; padding: 0; }
.view-tabs button, .mode-tabs button, .difficulty-tabs button { font: inherit; font-weight: 800; color: var(--ink); cursor: pointer; }
.view-tabs button { padding: 7px 14px; border: 1px solid transparent; border-radius: 10px; background: transparent; white-space: nowrap; }
.view-tabs button[aria-selected="true"] { color: var(--focus-hover); background: rgba(255, 143, 179, 0.13); border-color: rgba(255, 143, 179, 0.28); }
.view-panel[hidden], .activity-panel[hidden] { display: none !important; }
.bar { position: sticky; top: 10px; z-index: 10; max-width: 1360px; margin: 10px auto 16px; padding: 8px 14px; background: rgba(255,255,255,.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 2px solid rgba(255,255,255,.9); border-radius: 14px; box-shadow: 0 5px 16px rgba(74,74,74,.07); }
.bar-in { flex: initial; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.view-panel.study-view { max-width: 1120px; margin: 14px auto 60px; padding: 22px; background: transparent; border: 0; border-radius: 0; box-shadow: none; }
.study-controls, .activity-heading, .activity-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.study-controls { margin-bottom: 20px; }
.study-controls label { font-weight: 800; }
.study-controls select { min-width: 210px; max-width: 100%; padding: 8px 34px 8px 12px; font: inherit; font-weight: 700; color: var(--ink); background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: 10px; }
.study-progress { margin-left: auto; padding: 6px 10px; color: var(--muted); font-weight: 700; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
.mode-tabs, .difficulty-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.mode-tabs { margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.mode-tabs button, .difficulty-tabs button { padding: 7px 12px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.8); }
.mode-tabs button[aria-selected="true"], .difficulty-tabs button[aria-pressed="true"] { color: #fff; border-color: var(--focus-hover); background: var(--focus-hover); }
.activity-heading { justify-content: space-between; margin-bottom: 12px; }
.activity-heading h2 { margin: 0; font-size: 1.25rem; color: var(--focus-hover); }
.activity-heading span { color: var(--muted); font-weight: 800; }
.study-card { max-width: 760px; min-height: 230px; margin: 0 auto 16px; padding: 24px; display: flex; flex-direction: column; justify-content: center; text-align: center; background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 14px; }
.study-term { font-family: var(--font-head); font-size: 1.8rem; font-weight: 800; color: var(--focus-hover); overflow-wrap: anywhere; }
.study-meta { margin-top: 4px; color: var(--muted); font-weight: 700; }
.study-answer { max-width: 58ch; margin: 16px auto 0; font-size: 1.02rem; white-space: pre-line; }
.activity-actions { justify-content: center; }
.activity-actions button, #quiz-next, #reading-next { padding: 8px 14px; font: inherit; font-weight: 800; color: #fff; border: 1px solid var(--focus-hover); border-radius: 10px; background: var(--focus); cursor: pointer; }
.activity-actions button:hover, #quiz-next:hover, #reading-next:hover { background: var(--focus-hover); }
.difficulty-tabs { margin-bottom: 16px; }
.quiz-prompt { max-width: 850px; margin: 0 0 14px; font-size: 1.05rem; font-weight: 700; }
.quiz-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; max-width: 900px; }
.quiz-options button { min-height: 48px; padding: 10px 14px; text-align: left; font: inherit; font-weight: 700; color: var(--ink); background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.quiz-options button:hover:not(:disabled) { border-color: var(--focus-hover); background: var(--surface-2); }
.quiz-options button:disabled { cursor: default; opacity: .84; }
.quiz-options button.correct { border-color: #58a99a; background: rgba(123,196,196,.25); }
.quiz-options button.incorrect { border-color: #e17680; background: rgba(255,154,158,.25); }
.quiz-feedback { min-height: 1.6em; font-weight: 800; }
.reading-article { width: fit-content; max-width: 100%; margin: 0 auto 24px; padding: 16px 20px; background: #fff; border-left: 5px solid var(--c-change); border-radius: 10px; }
.reading-kicker { color: var(--focus-hover); font-size: .84rem; font-weight: 800; text-transform: uppercase; }
.reading-article h2 { margin: 4px 0; font-family: var(--font-head); font-size: 1.45rem; color: var(--ink); }
.reading-level-label { margin: 0 0 16px; color: var(--muted); font-weight: 700; }
.reading-passage { max-width: 78ch; font-size: 1rem; line-height: 1.75; }
.reading-passage p { margin: 0 0 12px; }
.reading-passage p:last-child { margin-bottom: 0; }
.reading-quiz { width: min(100%, 940px); margin: 0 auto; padding: 16px 20px; background: #fff; border: 1px solid var(--line); border-radius: 10px; }

main { max-width: 1360px; margin: 0 auto; padding: 0 0 60px; }
section { margin-top: 50px; }
section h2 { 
  font-family: var(--font-head); font-size: 1.8rem; font-weight: 800; 
  width: fit-content; max-width: 100%; margin: 0 0 8px; padding: 6px 12px 6px 16px; 
  border-left: 8px solid var(--c); 
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; 
  background: rgba(255,255,255,0.78); backdrop-filter: blur(5px); 
  text-shadow: 0 2px 4px rgba(255,255,255,0.8); 
  border-radius: 10px;
}
section h2 small { font-family: var(--font-body); font-weight: 700; font-size: 1rem; color: var(--focus-hover); background: rgba(255,255,255,0.9); padding: 2px 10px; border-radius: 12px; border: 1px solid var(--line);}
section .lede { 
  margin: 0 0 20px 24px; color: var(--ink); font-weight: 600; font-size: 1.05rem; max-width: 80ch; 
  background: rgba(255,255,255,0.7); padding: 8px 16px; border-radius: 16px; 
  display: inline-block; backdrop-filter: blur(5px);
  border: 1px solid rgba(255,255,255,0.5);
}

.wrap {
  overflow-x: auto;
  border: 0;
  background: transparent;
}
table { border-collapse: collapse; width: 100%; min-width: 1180px; font-size: .95rem; }
thead th { 
  position: sticky; top: 0; 
  background: rgba(255, 240, 245, 0.95); 
  text-align: left; font-weight: 800; padding: 16px 18px; 
  border-bottom: 3px solid var(--c); white-space: nowrap; color: var(--ink); 
  z-index: 2; font-size: 1rem;
}
tbody td { padding: 14px 18px; vertical-align: top; border-bottom: 1px dashed var(--line); transition: background 0.2s ease; }
tbody tr { background: var(--surface); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }

td.w { 
  position: sticky; left: 0; 
  background: transparent; 
  min-width: 140px; max-width: 200px; 
  border-right: 2px dashed rgba(255, 182, 193, 0.4); 
  z-index: 1;
}
tbody tr:hover td.w { background: rgba(255, 245, 248, 1); }
td.w .hw { font-family: var(--font-head); font-weight: 800; font-size: 1.2rem; color: var(--c); line-height: 1.3; overflow-wrap: anywhere; }
td.w .pos { font-style: italic; color: var(--muted); font-size: .85rem; font-weight: 700; margin-top: 4px; display: inline-block; background: rgba(255, 240, 245, 0.8); padding: 2px 8px; border-radius: 8px;}
td.w .phonetic { font-family: var(--font-body); color: var(--focus-hover); font-size: .9rem; font-weight: 800; margin-top: 6px; }
td .vi { margin-top: 6px; font-weight: 800; color: var(--ink); font-size: 1.05rem;}

td .tag { 
  display: inline-block; font-weight: 800; font-size: .8rem; margin-right: 6px; 
  background: rgba(255,255,255,0.9); padding: 3px 10px; border-radius: 12px; 
  border: 1px solid rgba(255, 182, 193, 0.4); 
  box-shadow: 0 2px 4px rgba(255,182,193,0.1);
}
td .tag.s { color: var(--syn); }
td .tag.a { color: var(--ant); }

td div + div { margin-top: 8px; }
td ul.ph { margin: 0; padding-left: 20px; }
td ul.ph li { margin-bottom: 6px; font-weight: 600; }
td ul.ph li::marker { color: var(--focus-hover); }
td b { font-weight: 800; color: var(--ink); }

td.ex { 
  font-style: italic; color: #5a5a5a; font-weight: 600; 
  background: transparent; 
  padding: 10px 14px; border-radius: 12px; 
  display: inline-block; width: 100%; box-sizing: border-box;
  border-left: 3px solid var(--focus);
}
td.ex b { font-style: normal; color: var(--focus-hover); font-weight: 800; }

th.c-m, td.c-m { min-width: 250px; }
th.c-s, td.c-s { min-width: 190px; }
th.c-e, td.c-e { min-width: 250px; }
th.c-c, td.c-c { min-width: 230px; }
th.c-n, td.c-n { min-width: 250px; }

::-webkit-scrollbar { width: 14px; height: 14px; }
::-webkit-scrollbar-track { background: rgba(255, 240, 245, 0.6); border-radius: 14px; margin: 6px;}
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--focus), var(--focus-hover)); border-radius: 14px; border: 4px solid rgba(255, 240, 245, 0.8); }
::-webkit-scrollbar-thumb:hover { background: #ff5285; }

@media (max-width:900px){
  header.top { margin: 10px; padding: 12px 14px; gap: 10px; }
  .header-copy { flex-basis: 100%; }
  .view-tabs { max-width: 100%; overflow-x: auto; }
  .bar { margin: 10px; padding: 8px 10px; }
  .bar-in { width: 100%; }
  .nav { flex-basis: 100%; border-left: 0; padding-left: 0; }
  .view-panel.study-view { margin: 10px; padding: 16px; }
  .study-controls select { flex: 1 1 100%; }
  .study-progress { margin-left: 0; }
  .quiz-options { grid-template-columns: 1fr; }
  .study-card { min-height: 210px; padding: 18px; }
  .reading-article { padding: 18px; }
  .wrap { border: 0; background: transparent; overflow: visible; box-shadow: none; backdrop-filter: none; }
  table, thead, tbody, tr, td { display: block; min-width: 0; width: 100%; }
  thead { display: none; }
  
  tbody tr { 
    background: var(--surface); 
    border: 2px solid rgba(255, 255, 255, 0.9); border-left: 8px solid var(--c); 
    border-radius: 24px; margin-bottom: 20px; padding: 12px 0; 
    box-shadow: none; 
  }
  tbody td { border: 0; padding: 10px 20px; min-width: 0!important; max-width: none!important; }
  td.w { position: static; border: 0; background: transparent; padding-bottom: 0;}
  tbody tr:hover td, tbody tr:hover td.w { background: transparent; }
  td[data-l]::before { 
    content: attr(data-l); display: block; font-size: .85rem; font-weight: 800; 
    color: var(--focus-hover); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .melody-widget {
    transform: scale(0.4); 
    bottom: 10px;
    right: 10px;
  }
  @keyframes floatWidget {
    0%, 100% { transform: scale(0.4) translateY(0); }
    50% { transform: scale(0.4) translateY(-8px); }
  }
}
</style>

</head>
<body>
<header class="top">
  <div class="header-copy">
    <h1>Tổng hợp từ vựng C1&2 theo chủ đề</h1>
  </div>
  <nav class="view-tabs" role="tablist" aria-label="Khu vực học">
    <button id="tab-vocabulary" type="button" role="tab" aria-selected="true" aria-controls="view-vocabulary">Từ vựng</button>
    <button id="tab-review" type="button" role="tab" aria-selected="false" aria-controls="view-review">Ôn tập</button>
    <button id="tab-reading" type="button" role="tab" aria-selected="false" aria-controls="view-reading">Reading</button>
  </nav>
</header>

<div id="view-vocabulary" class="view-panel" role="tabpanel" aria-labelledby="tab-vocabulary">
<div class="bar">
  <div class="bar-in">
    <div class="dropdown-wrapper" id="topicsWrapper">
      <button type="button" class="topics-btn" id="topicsBtn" aria-haspopup="true" aria-expanded="false">
        <span id="topicsLabel">Tổng hợp Unit</span>
      </button>
      <div class="topics-dropdown" id="topics" role="group" aria-label="Chủ đề"></div>
    </div>
    <nav class="nav" id="nav" aria-label="Các phần"></nav>
  </div>
</div>

<main id="app"></main>
</div>

<section id="view-review" class="view-panel study-view" role="tabpanel" aria-labelledby="tab-review" hidden>
  <div class="study-controls">
    <label for="study-unit">Unit</label>
    <select id="study-unit"></select>
    <span id="study-progress" class="study-progress" aria-live="polite"></span>
  </div>
  <div class="mode-tabs" role="tablist" aria-label="Chế độ ôn tập">
    <button id="mode-cards" type="button" role="tab" aria-selected="true" aria-controls="review-cards">Flashcard</button>
    <button id="mode-quiz" type="button" role="tab" aria-selected="false" aria-controls="review-quiz">Quiz</button>
  </div>
  <div id="review-cards" class="activity-panel" role="tabpanel" aria-labelledby="mode-cards">
    <div class="activity-heading"><h2>Flashcard</h2><span id="card-position" aria-live="polite"></span></div>
    <article class="study-card" aria-live="polite">
      <div id="card-term" class="study-term"></div>
      <div id="card-meta" class="study-meta"></div>
      <div id="card-answer" class="study-answer" hidden></div>
    </article>
    <div class="activity-actions">
      <button id="card-reveal" type="button">Hiện đáp án</button>
      <button id="card-review" type="button" hidden>Ôn lại</button>
      <button id="card-known" type="button" hidden>Đã nhớ</button>
      <button id="card-next" type="button" hidden>Thẻ tiếp theo</button>
    </div>
  </div>
  <div id="review-quiz" class="activity-panel" role="tabpanel" aria-labelledby="mode-quiz" hidden>
    <div class="activity-heading"><h2>Quiz</h2><span id="quiz-score" aria-live="polite"></span></div>
    <div class="difficulty-tabs" role="group" aria-label="Mức độ quiz">
      <button type="button" data-level="basic" aria-pressed="true">Cơ bản</button>
      <button type="button" data-level="intermediate" aria-pressed="false">Trung cấp</button>
      <button type="button" data-level="advanced" aria-pressed="false">Vận dụng</button>
    </div>
    <div id="quiz-prompt" class="quiz-prompt" aria-live="polite"></div>
    <div id="quiz-options" class="quiz-options"></div>
    <p id="quiz-feedback" class="quiz-feedback" aria-live="polite"></p>
    <button id="quiz-next" type="button" hidden>Câu tiếp theo</button>
  </div>
</section>

<section id="view-reading" class="view-panel study-view" role="tabpanel" aria-labelledby="tab-reading" hidden>
  <div class="study-controls">
    <label for="reading-unit">Unit</label>
    <select id="reading-unit"></select>
    <label for="reading-level">Level</label>
    <select id="reading-level">
      <option value="c1">C1</option>
      <option value="c2">C2</option>
    </select>
  </div>
  <article class="reading-article">
    <div id="reading-unit-title" class="reading-kicker"></div>
    <h2 id="reading-title"></h2>
    <p id="reading-level-label" class="reading-level-label"></p>
    <div id="reading-passage" class="reading-passage"></div>
  </article>
  <div class="reading-quiz">
    <div class="activity-heading"><h2>Comprehension</h2><span id="reading-progress" aria-live="polite"></span></div>
    <p id="reading-question" class="quiz-prompt" aria-live="polite"></p>
    <div id="reading-options" class="quiz-options"></div>
    <p id="reading-feedback" class="quiz-feedback" aria-live="polite"></p>
    <button id="reading-next" type="button" hidden>Câu tiếp theo</button>
  </div>
</section>

<script>
/* Mỗi từ: [từ, loại từ, nghĩa Anh, nghĩa Việt, synonyms, antonyms, ví dụ (ngăn cách bằng |), collocations, sắc thái và ngữ cảnh] */
const CHANGE = [

function fmt(s){ return s.split('|').map(x => x.replace(/\*(.+?)\*/g,'<b>$1</b>')).join('<br>'); }
function items(s){
  return '<ul class="ph">' + s.split('¦').map(x => {
    const i = x.indexOf(' = ');
    return i < 0 ? '<li><b>'+x+'</b></li>' : '<li><b>'+x.slice(0,i)+'</b> — '+x.slice(i+3)+'</li>';
  }).join('') + '</ul>';
}
function synant(syn, ant){
  let h = '';
  if (syn) h += '<div><span class="tag s">Syn.</span>'+syn+'</div>';
  if (ant) h += '<div><span class="tag a">Ant.</span>'+ant+'</div>';
  return h || '<span style="color:var(--muted)">—</span>';
}
function headCells(cols){ return '<tr>'+cols.map(c => '<th class="'+(c[1]||'')+'">'+c[0]+'</th>').join('')+'</tr>'; }

function buildSection(topicId, sec){
  let head, rowsHtml;
  if (sec.type === 'wf') {
    head = headCells([["Từ gốc",""],["Các dạng từ (loại từ và nghĩa)","c-m"],["Ví dụ","c-e"],["Lưu ý và bẫy thường gặp","c-n"]]);
    rowsHtml = sec.data.map(r =>
      '<tr><td class="w" data-l="Từ gốc"><div class="hw">'+r[0]+'</div></td>'+
      '<td class="c-m" data-l="Các dạng từ">'+items(r[1])+'</td>'+
      '<td class="c-e ex" data-l="Ví dụ">'+fmt(r[2])+'</td>'+
      '<td class="c-n" data-l="Lưu ý">'+r[3]+'</td></tr>').join('');
  } else {
    const meaningLabel = sec.type === 'phrases' ? 'Cụm trong sách (Anh – Việt)' : 'Nghĩa (Anh – Việt)';
    head = headCells([
      [sec.type === 'phrases' ? 'Từ khóa' : (sec.id === 'idioms' ? 'Thành ngữ' : 'Từ'),""],
      [meaningLabel,"c-m"],["Synonyms / Antonyms","c-s"],["Ví dụ","c-e"],["Collocations","c-c"],["Sắc thái và ngữ cảnh","c-n"]]);
    rowsHtml = sec.data.map(r => {
      const meaning = sec.type === 'phrases'
        ? items(r[2])
        : '<div>'+r[2]+'</div><div class="vi">'+r[3]+'</div>';
      const posHtml = r[1] ? '<div class="pos">'+r[1]+'</div>' : '';
      return '<tr><td class="w" data-l="'+(sec.type==='phrases'?'Từ khóa':'Từ')+'"><div class="hw">'+r[0]+'</div>'+posHtml+'</td>'+
        '<td class="c-m" data-l="'+meaningLabel+'">'+meaning+'</td>'+
        '<td class="c-s" data-l="Synonyms / Antonyms">'+synant(r[4], r[5])+'</td>'+
        '<td class="c-e ex" data-l="Ví dụ">'+fmt(r[6])+'</td>'+
        '<td class="c-c" data-l="Collocations">'+r[7]+'</td>'+
        '<td class="c-n" data-l="Sắc thái và ngữ cảnh">'+r[8]+'</td></tr>';
    }).join('');
  }
  const el = document.createElement('section');
  el.id = topicId + '-' + sec.id;
  el.style.setProperty('--c', 'var('+sec.cls+')');
  el.innerHTML =
    '<h2>'+sec.title+' <small>'+sec.data.length+' mục</small></h2>'+
    '<p class="lede">'+sec.lede+'</p>'+
    '<div class="wrap"><table><thead>'+head+'</thead><tbody>'+rowsHtml+'</tbody></table></div>';
  return el;
}

function readStorage(key, fallback){
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch (error) {
    return fallback;
  }
}
function writeStorage(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (error) {}
}
let savedProgress = readStorage(storageKey, {});
function progressFor(unitId){
  if (!savedProgress[unitId]) savedProgress[unitId] = {known: [], best: {}};
  if (!Array.isArray(savedProgress[unitId].known)) savedProgress[unitId].known = [];
  if (!savedProgress[unitId].best) savedProgress[unitId].best = {};
  return savedProgress[unitId];
}
function saveProgress(){ writeStorage(storageKey, savedProgress); }
function shuffle(list){
  const result = list.slice();
  for (let index = result.length - 1; index > 0; index--){
    const swapIndex = Math.floor(Math.random() * (index + 1));
    [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
  }
  return result;
}
function wordBank(unitId){
  const topic = TOPICS.find(item => item.id === unitId);
  if (!topic) return [];
  return topic.sections.filter(section => section.type === 'vocab').flatMap(section =>
    section.data.map(row => ({
      term: String(row[0] || ''),
      pos: String(row[1] || ''),
      definition: String(row[2] || ''),
      meaning: String(row[3] || row[2] || ''),
      example: String(row[6] || ''),
      collocations: String(row[7] || ''),
      nuance: String(row[8] || '')
    }))
  ).filter(item => item.term);
}

}

const cardTerm = document.getElementById('card-term');
const cardMeta = document.getElementById('card-meta');
const cardAnswer = document.getElementById('card-answer');
const cardPosition = document.getElementById('card-position');
const cardReveal = document.getElementById('card-reveal');
const cardReview = document.getElementById('card-review');
const cardKnown = document.getElementById('card-known');
const cardNext = document.getElementById('card-next');
let cardQueue = [];
let cardRetry = [];
let cardIndex = 0;

function updateStudyProgress(){
  const bank = wordBank(studyUnit.value);
  const progress = progressFor(studyUnit.value);
  const best = Object.values(progress.best).filter(Number.isFinite);
  const bestText = best.length ? ' · Quiz tốt nhất ' + Math.max(...best) + '/10' : '';
  document.getElementById('study-progress').textContent = progress.known.length + '/' + bank.length + ' từ đã nhớ' + bestText;
}
function renderCard(){
  if (cardIndex >= cardQueue.length && cardRetry.length){
    cardQueue = shuffle(cardRetry).map(item => ({...item, retryRound: true}));
    cardRetry = [];
    cardIndex = 0;
  }
  if (!cardQueue.length || cardIndex >= cardQueue.length){
    cardTerm.textContent = 'Hoàn tất lượt ôn';
    cardMeta.textContent = '';
    cardAnswer.textContent = 'Bạn đã xem hết các thẻ trong lượt này.';
    cardAnswer.hidden = false;
    cardPosition.textContent = '';
    cardReveal.hidden = true;
    cardReview.hidden = true;
    cardKnown.hidden = true;
    cardNext.hidden = true;
    updateStudyProgress();
    return;
  }
  const item = cardQueue[cardIndex];
  cardTerm.textContent = item.term;
  cardMeta.textContent = item.pos;
  cardAnswer.textContent = [item.meaning, item.definition, item.example.replace(/\*(.*?)\*/g, '$1'), item.collocations].filter(Boolean).join('\n');
  cardAnswer.hidden = true;
  cardPosition.textContent = (item.retryRound ? 'Ôn lại · ' : '') + (cardIndex + 1) + '/' + cardQueue.length;
  cardReveal.hidden = false;
  cardReview.hidden = true;
  cardKnown.hidden = true;
  cardNext.hidden = true;
  updateStudyProgress();
}
function startCards(){
  cardQueue = shuffle(wordBank(studyUnit.value));
  cardRetry = [];
  cardIndex = 0;
  renderCard();
}
cardReveal.addEventListener('click', () => {
  cardAnswer.hidden = false;
  cardReveal.hidden = true;
  cardReview.hidden = false;
  cardKnown.hidden = false;
  cardNext.hidden = false;
});
cardReview.addEventListener('click', () => {
  if (cardQueue[cardIndex]) cardRetry.push(cardQueue[cardIndex]);
  cardIndex++;
  renderCard();
});
cardKnown.addEventListener('click', () => {
  const progress = progressFor(studyUnit.value);
  const term = cardQueue[cardIndex] && cardQueue[cardIndex].term;
  if (term && !progress.known.includes(term)) progress.known.push(term);
  saveProgress();
  cardIndex++;
  renderCard();
});
cardNext.addEventListener('click', () => { cardIndex++; renderCard(); });

const quizPrompt = document.getElementById('quiz-prompt');
const quizOptions = document.getElementById('quiz-options');
const quizFeedback = document.getElementById('quiz-feedback');
const quizScore = document.getElementById('quiz-score');
const quizNext = document.getElementById('quiz-next');
let quizLevel = 'basic';
let quizRound = [];
let quizIndex = 0;
let quizCorrect = 0;
let quizAnswered = false;
let quizFinished = false;
function choiceLabel(item){ return quizLevel === 'basic' ? (item.meaning || item.definition) : item.term; }
function makeChoices(answer){
  const choices = [answer];
  const labels = new Set([choiceLabel(answer)]);
  shuffle(wordBank(studyUnit.value).filter(item => item !== answer)).some(item => {
    const label = choiceLabel(item);
    if (label && !labels.has(label)){
      labels.add(label);
      choices.push(item);
    }
    return choices.length === 4;
  });
  return shuffle(choices);
}
function renderQuizQuestion(){
  quizAnswered = false;
  quizNext.hidden = true;
  quizFeedback.textContent = '';
  quizOptions.replaceChildren();
  if (!quizRound.length){
    quizPrompt.textContent = 'Chủ đề này chưa có từ để luyện.';
    quizScore.textContent = '';
    return;
  }
  if (quizFinished){
    quizPrompt.textContent = 'Hoàn thành lượt quiz!';
    quizFeedback.textContent = 'Bạn trả lời đúng ' + quizCorrect + '/' + quizRound.length + ' câu.';
    quizNext.textContent = 'Làm lượt mới';
    quizNext.hidden = false;
    return;
  }
  const item = quizRound[quizIndex];
  quizScore.textContent = 'Câu ' + (quizIndex + 1) + '/' + quizRound.length + ' · đúng ' + quizCorrect;
  if (quizLevel === 'basic') quizPrompt.textContent = '“' + item.term + '” có nghĩa nào?';
  else if (quizLevel === 'intermediate'){
    const cloze = item.example.replace(/\*(.*?)\*/g, '_____');
    quizPrompt.textContent = cloze !== item.example ? cloze : 'Chọn từ phù hợp với câu: ' + item.example;
  } else quizPrompt.textContent = 'Chọn từ/cụm phù hợp với mô tả: ' + (item.nuance || item.definition || item.meaning);
  makeChoices(item).forEach(choice => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = choiceLabel(choice);
    button.addEventListener('click', () => answerQuiz(button, choice, item));
    quizOptions.appendChild(button);
  });
}
function startQuiz(){
  quizRound = shuffle(wordBank(studyUnit.value)).slice(0, 10);
  quizIndex = 0;
  quizCorrect = 0;
  quizFinished = false;
  quizNext.textContent = 'Câu tiếp theo';
  renderQuizQuestion();
}
function answerQuiz(button, choice, answer){
  if (quizAnswered) return;
  quizAnswered = true;
  const correct = choice === answer;
  if (correct) quizCorrect++;
  quizOptions.querySelectorAll('button').forEach(option => {
    option.disabled = true;
    if (option.textContent === choiceLabel(answer)) option.classList.add('correct');
  });
  if (!correct) button.classList.add('incorrect');
  quizFeedback.textContent = correct ? 'Chính xác! ' + (answer.nuance || answer.meaning) : 'Chưa đúng. Đáp án: ' + answer.term + ' · ' + answer.meaning;
  quizScore.textContent = 'Câu ' + (quizIndex + 1) + '/' + quizRound.length + ' · đúng ' + quizCorrect;
  quizNext.textContent = quizIndex === quizRound.length - 1 ? 'Xem kết quả' : 'Câu tiếp theo';
  quizNext.hidden = false;
}
quizNext.addEventListener('click', () => {
  if (quizFinished){ startQuiz(); return; }
  if (!quizAnswered) return;
  if (quizIndex === quizRound.length - 1){
    quizFinished = true;
    const progress = progressFor(studyUnit.value);
    progress.best[quizLevel] = Math.max(progress.best[quizLevel] || 0, quizCorrect);
    saveProgress();
    updateStudyProgress();
  } else quizIndex++;
  renderQuizQuestion();
});

    c1: {title:'Designing Technology for Longer Use', passage:`Many electronic products are replaced long before they stop working. A damaged battery or an unavailable component can make repair uneconomical, even when the rest of the device remains useful. Some manufacturers have begun designing products that can be opened with ordinary tools and supplying replacement parts for several years.\n\nThis approach may raise production costs slightly, but it can reduce waste and strengthen customer trust. Repairability alone is not enough: consumers also need clear instructions, trained technicians and affordable components. Durable technology is therefore not simply what lasts longest in a laboratory, but what people can maintain in real conditions.`, questions:[

      {prompt:'What does the passage suggest manufacturers can do?', options:['Provide repairable designs and replacement parts.','Make devices impossible to open.','Require customers to replace devices yearly.','Avoid publishing instructions.'], answer:0, explanation:'The examples include products that open with ordinary tools and parts supplied for years.'},
      {prompt:'What else is needed for repairability to work?', options:['Instructions, trained technicians and affordable parts.','Laboratory testing alone.','Shorter product guarantees.','More online advertising.'], answer:0, explanation:'The second paragraph names instructions, technicians and affordable components.'}
    ]},
    c2: {title:'When Innovation Is Measured by Replacement', passage:`Technological progress is often presented as a sequence of superior devices displacing inferior ones. That account is persuasive when a new tool makes a task safer or more accessible. It is less convincing when novelty is treated as proof of improvement, regardless of material costs or the shortened lifespan of what came before.\n\nA rigorous assessment asks what a system enables, whom it benefits and what it renders disposable. Repair networks and long-term software support may seem less dramatic than a product launch, yet they can create greater public value. Innovation is not synonymous with acceleration; it also includes preserving useful knowledge and materials while adapting them to new needs.`, questions:[
      {prompt:'What assumption does the writer question?', options:['That every new device is necessarily an improvement.','That technology can make tasks safer.','That old tools can become inaccessible.','That product launches attract attention.'], answer:0, explanation:'The passage challenges the idea that novelty itself proves improvement.'},
      {prompt:'Why might repair networks create public value?', options:['They preserve useful materials and support longer use.','They make every product more expensive.','They guarantee rapid replacement.','They remove the need to adapt technology.'], answer:0, explanation:'The passage links repair networks with preserving materials and supporting longer use.'},
      {prompt:'How does the author broaden the meaning of innovation?', options:['It includes adaptation and preservation, not just acceleration.','It means producing devices as quickly as possible.','It requires replacing shared systems with personal devices.','It depends on dramatic launches.'], answer:0, explanation:'The conclusion includes preserving resources while adapting them to new needs.'}
    ]}
  },
  tl: {
    c1: {title:'Why Familiarity Can Be Misleading', passage:`Students often reread a chapter because the material begins to feel familiar. That feeling can be mistaken for understanding: the page looks recognisable, but the learner may struggle to explain its argument without looking. Brief attempts to recall ideas from memory reveal gaps more clearly than another uninterrupted rereading.\n\nRecall is most useful when followed by feedback. A learner can compare an explanation with the source, correct an error and return to the topic later. Rereading still has value when it clarifies details after an attempt to remember. The sequence matters: first retrieve the idea, then use the text to refine it.`, questions:[
      {prompt:'What mistaken conclusion can familiarity create?', options:['Recognising the page means one can explain its ideas.','The material has been forgotten entirely.','Feedback is unnecessary.','Rereading always makes learning worse.'], answer:0, explanation:'The passage contrasts familiarity with being able to explain the content without looking.'},
      {prompt:'What should follow an attempt to recall information?', options:['Feedback and correction against the source.','A decision never to revisit the subject.','More passive reading without a check.','A change to an unrelated topic.'], answer:0, explanation:'The learner compares recall with the source and corrects errors.'},
      {prompt:'Which sequence does the writer recommend?', options:['Recall first, then use the text to refine understanding.','Reread repeatedly and avoid testing.','Memorise details without checking them.','Read the answer before attempting recall.'], answer:0, explanation:'The final sentence recommends retrieval before refinement.'}
    ]},
    c2: {title:'The Limits of Introspection in Learning', passage:`Learners are not always reliable judges of what they know. Ease of processing can create confidence, while the ability to produce an answer under unfamiliar conditions remains weak. This gap helps explain why routines that feel productive are not invariably effective. The sensation of fluency describes an experience; it does not necessarily demonstrate durable learning.\n\nA better evaluation separates practice from measurement. During practice, prompts and notes can support difficult material; during measurement, those supports should be reduced so recall is tested independently. Results can then guide the next study session. Tasks differ, so no single method is universal, but evidence is more useful than vague confidence.`, questions:[
      {prompt:'What distinction does the passage make about fluency?', options:['It describes how processing feels, not necessarily what can be recalled later.','It proves long-term retention.','It is unrelated to learning.','It guarantees performance in unfamiliar tasks.'], answer:0, explanation:'The text says fluency is not proof of durable learning.'},
      {prompt:'Why reduce prompts during measurement?', options:['To test whether recall works independently.','To make practice more enjoyable.','To avoid collecting results.','To ensure every task is identical.'], answer:0, explanation:'Reduced support tests independent recall.'},
      {prompt:'What does the writer say the method provides?', options:['Actionable evidence instead of vague confidence.','A universal formula for every subject.','A reason to stop practising.','A way to avoid adapting study sessions.'], answer:0, explanation:'The conclusion contrasts useful evidence with vague confidence.'}
    ]}
  },
  tw: {
    c1: {title:'Protecting Time for Difficult Work', passage:`Many workplaces measure responsiveness because it is easy to observe: messages are answered, meetings are attended and tasks are marked complete. Concentrated work is less visible. Someone may spend an uninterrupted hour resolving a complex problem yet appear less active than a colleague who replies to every notification.\n\nTeams can protect focused time by agreeing when routine messages need not be answered immediately. This is not a rejection of collaboration; it makes collaboration more deliberate. A shared schedule matters too, since quiet time is of little use if colleagues do not know when urgent help is available.`, questions:[
      {prompt:'Why can concentrated work be undervalued?', options:['It is less visible than quick replies and meetings.','It always produces fewer results.','It prevents all collaboration.','It is easier to measure than responsiveness.'], answer:0, explanation:'The passage contrasts visible responsiveness with less visible focused work.'},
      {prompt:'What is the purpose of agreed focus periods?', options:['Allow uninterrupted work while making collaboration deliberate.','Make routine communication impossible.','Prevent colleagues from seeking urgent help.','Increase the number of meetings.'], answer:0, explanation:'The text says focus periods support deliberate, rather than constant, collaboration.'},
      {prompt:'Why share the focus schedule?', options:['So colleagues know when urgent help is available.','So nobody can plan individual work.','So every message gets an instant reply.','So managers can cancel all meetings.'], answer:0, explanation:'A shared schedule clarifies when urgent help can be expected.'}
    ]},
    c2: {title:'Productivity and the Problem of Measurement', passage:`When an organisation converts work into visible indicators, it gains comparability but risks confusing the indicator with the purpose it represents. The number of calls completed, for instance, may say little about whether a complicated case was resolved fairly. Once a target becomes a measure of success, employees may redirect effort toward what is counted.\n\nThis is not an argument against measurement. It is a case for combining quantitative indicators with professional judgement and periodic review. Measures are provisional descriptions, not complete accounts of value. The more varied the work, the more cautious an organisation should be about using a single number to allocate time or reward performance.`, questions:[
      {prompt:'What risk follows when an indicator is treated as the purpose of work?', options:['Effort may shift toward what is counted rather than the intended outcome.','Organisations lose the ability to compare results.','Professional judgement becomes more visible.','Complex cases are always resolved more fairly.'], answer:0, explanation:'The passage warns that targets can redirect effort toward the measured activity.'},
      {prompt:'What approach does the writer recommend?', options:['Combine indicators with judgement and review.','Abandon all measurement.','Use one number for every kind of work.','Reward only the fastest employees.'], answer:0, explanation:'The second paragraph recommends combining metrics with professional judgement and review.'},
      {prompt:'When should organisations be especially cautious with a single metric?', options:['When work is varied and difficult to summarise.','When no decisions depend on the metric.','When all results are identical.','When employees have clear responsibilities.'], answer:0, explanation:'The conclusion cautions against using one number for varied work.'}
    ]}
  },
  mt: {
    c1: {title:'Planning Streets for More Than Cars', passage:`Transport plans are often evaluated by how quickly vehicles move through a corridor. Yet a street also connects homes to schools, shops and public services. A design that reduces journey time for drivers may make crossing harder for pedestrians or leave people with limited mobility waiting longer at junctions.\n\nSome cities have tested wider pavements, safer crossings and dedicated bus lanes before making permanent changes. Trials let officials observe how different groups use the street and adjust the design. Their value depends on gathering evidence from residents who travel at different times and in different ways, not only from people who commute by car.`, questions:[
      {prompt:'What limitation of car-focused planning is identified?', options:['It may overlook how streets connect people to essential places.','It always increases pedestrian safety.','It removes the need for public transport.','It measures too many different users.'], answer:0, explanation:'The passage notes that streets connect residents to schools, shops and services.'},
      {prompt:'Why run temporary street-design trials?', options:['To observe use and adjust the plan before permanent changes.','To prevent residents from using the road.','To guarantee every trip is shorter.','To collect opinions only from drivers.'], answer:0, explanation:'Trials help officials observe use and revise a design.'},
      {prompt:'Whose experiences should inform the evidence?', options:['Residents with different travel patterns.','Only people who drive to work.','Only people who live beside the street.','Transport officials alone.'], answer:0, explanation:'The text calls for evidence from people travelling at different times and in different ways.'}
    ]},
    c2: {title:'Resilience in Urban Transport', passage:`A transport network can appear efficient while remaining vulnerable to disruption. If commuters depend on one bridge, rail line or transfer point, a local failure may interrupt journeys across an entire city. Redundancy is sometimes dismissed as waste because alternative routes are used infrequently. In practice, those routes can provide capacity during maintenance, extreme weather or an unexpected closure.\n\nResilience also depends on coordination between operators, timely public information and routes usable by people with different needs. Evaluating a network only by average travel time conceals how unevenly disruption is experienced. A robust system maintains access to work, education and care without depending on a single point of failure.`, questions:[
      {prompt:'Why can an apparently efficient network remain vulnerable?', options:['It may depend on a single route or transfer point.','It always has too many alternative routes.','Its average travel time is too short.','It provides too much information.'], answer:0, explanation:'Dependence on one route can allow a local failure to disrupt a wider network.'},
      {prompt:'What value can an infrequently used alternative route provide?', options:['Capacity during disruption or maintenance.','A guarantee that disruption never occurs.','A reason to stop coordinating operators.','Reduced access for all travellers.'], answer:0, explanation:'Alternative routes provide capacity when the main route is unavailable.'},
      {prompt:'What should a robust system avoid?', options:['Making essential access depend on one point of failure.','Providing information during disruption.','Considering different traveller needs.','Coordinating between operators.'], answer:0, explanation:'The passage defines resilience as maintaining access despite a single failure.'}
    ]}
  }
};

const READING_EXTENSIONS = {
  tech: {
    c1: {
      passage: `Repair cooperatives offer one practical response. Residents bring in household devices, learn how to identify common faults and share tools that would be expensive to buy individually. The work is not always successful, but the process can make repair feel less specialised and encourage people to ask whether a product is designed to be maintained. Some local authorities have supported these groups by providing space or connecting them with technical colleges.\n\nThere are limits to what community action can achieve. A device may be sealed, its software may stop receiving updates, or a replacement component may cost nearly as much as a new product. For that reason, repair advocates also call for longer software support and clearer access to parts. Their broader point is that durability depends on decisions made throughout a product's life, from initial design to the services available after purchase.`,

        {prompt:'Vocabulary in context: “sealed” most nearly means…', options:['closed so it is difficult to open','labelled with a repair date','connected to a wireless network','made from recycled material'], answer:0, explanation:'A sealed device is difficult to open for inspection or repair.'},

    c2: {
      passage: `Procurement decisions can reinforce these principles. A school or public agency that buys equipment in large quantities can ask suppliers to disclose how long software updates will continue, whether components can be replaced and what happens when a model is discontinued. Such requirements do not dictate a single design. They make the expected lifetime of a product part of the comparison, alongside its purchase price and performance.\n\nThere is also a risk that efficiency gains will encourage people to consume more, cancelling some environmental benefits. A lighter device may use fewer materials per unit, for example, while rapid upgrade cycles still generate a large volume of waste. The relevant question is therefore not whether innovation should stop, but whether its benefits endure beyond the launch period. Evaluating that question requires evidence about maintenance, use and disposal over time.`,

        {prompt:'What does “cancelling” mean in the phrase “cancelling some environmental benefits”?', options:['Offsetting or reducing the benefits','Publishing the benefits','Making the benefits permanent','Measuring the benefits accurately'], answer:0, explanation:'The passage describes increased consumption undoing some environmental gains.'},

  tl: {
    c1: {
      passage: `Spacing practice over several days can make recall more demanding than reviewing everything in one sitting. That difficulty is not necessarily a sign that study is failing. When a learner retrieves an idea after a delay, the effort can help make later access more reliable. The intervals do not need to follow a perfect formula; they can be adjusted when material is especially unfamiliar or when an assessment is approaching.\n\nA useful routine combines retrieval with correction. A student might write down the main claims from memory, compare them with the chapter and note which links were missing. On a later attempt, the student can focus on those gaps rather than repeat the entire chapter. This process turns mistakes into information about what to study next, while leaving room for rereading when a detail remains unclear.`,
      questions: [

        {prompt:'What should a learner do after writing down ideas from memory?', options:['Compare them with the source and identify missing links.','Start a different subject immediately.','Avoid looking at the chapter again.','Memorise the notes without checking them.'], answer:0, explanation:'The suggested routine checks recall against the chapter and notes gaps.'},

      ]
    },
    c2: {
      passage: `Calibration improves when learners compare what they expect to remember with what they can actually produce. Before a quiz, a student might rate confidence in each answer; afterwards, the ratings can be compared with the results. Repeated mismatches reveal whether confidence is consistently too high, too low or accurate only for certain kinds of material. The purpose is not to judge a learner's character, but to make future decisions better informed.\n\nThis evidence can shape the next study session. If definitions are recalled accurately but arguments are difficult to reconstruct, practice can shift toward explaining relationships between ideas. If performance drops when examples change, the learner may need to apply a principle in more varied contexts. In this way, monitoring becomes part of learning rather than a separate act of self-evaluation.`,

        {prompt:'What does the example of changing examples test?', options:['Whether a learner can apply a principle in varied contexts.','Whether definitions can be copied quickly.','Whether confidence is always too high.','Whether a quiz contains enough questions.'], answer:0, explanation:'The passage says varied examples can reveal whether a principle transfers to new contexts.'},
        {prompt:'Vocabulary in context: “mismatches” refers to…', options:['differences between expected and actual performance','similarities between two textbooks','errors in the quiz instructions','changes in the subject being studied'], answer:0, explanation:'The term refers to a gap between confidence ratings and results.'}

    }
  },
  tw: {
    c1: {
      passage: `Managers can make this distinction clearer by evaluating outcomes as well as availability. A team handling complex cases, for instance, might review the quality and completion of its work instead of counting only how quickly staff reply. This does not mean that response time is irrelevant; urgent situations may require a prompt answer. It means that speed should be interpreted alongside the purpose and difficulty of the task.\n\nSome teams test shared periods without meetings or routine notifications. They can then review whether the change improves concentration, delays necessary decisions or shifts interruptions to another part of the day. The trial is most informative when workers can describe the conditions that help them focus and when the team adjusts its expectations in response. Protecting attention becomes a practical design question, not simply an individual test of discipline.`,
      questions: [
        {prompt:'What does the passage suggest managers consider alongside response time?', options:['The quality and completion of work.','The number of notifications received.','How often employees change jobs.','The length of every meeting.'], answer:0, explanation:'The example evaluates work quality and completion as well as response time.'},
        {prompt:'Why review a trial of meeting-free periods?', options:['To see whether focus improves and what costs or delays arise.','To prove interruptions can be eliminated permanently.','To make every employee follow an identical schedule.','To avoid hearing from workers.'], answer:0, explanation:'The trial checks benefits and possible delays or shifted interruptions.'},
        {prompt:'True / False / Not Given: The writer says urgent messages should never receive a prompt response.', options:['True','False','Not Given'], answer:1, explanation:'The passage says urgent situations may require a prompt answer.'}
      ]
    },
    c2: {
      passage: `Once a measure becomes a target, people may adapt their behaviour to it. If a call centre rewards only the number of cases closed, employees could be encouraged to resolve simple cases quickly while avoiding difficult ones. The resulting figures may improve even as the service becomes less equitable. This is not necessarily evidence of bad faith; it can be a predictable response to the incentives built into the system.\n\nA more robust evaluation uses several sources of evidence and examines who benefits from the measured outcome. Quantitative indicators can reveal patterns across a large organisation, while case reviews and staff accounts can explain why those patterns occur. Measures should also be revisited as responsibilities change. Used cautiously, they can inform decisions; treated as complete representations of value, they can conceal the very work an organisation needs to understand.`,
      questions: [

        {prompt:'What can case reviews and staff accounts add to quantitative indicators?', options:['An explanation for why measured patterns occur.','A guarantee that every measure is unbiased.','A replacement for all numerical evidence.','A way to prevent responsibilities from changing.'], answer:0, explanation:'The passage says qualitative sources can explain the reasons behind patterns.'},
        {prompt:'Vocabulary in context: “incentives” are…', options:['rewards or pressures that influence behaviour','records of completed work','unexpected technical failures','formal descriptions of responsibilities'], answer:0, explanation:'Incentives are factors that encourage particular choices or actions.'}
      ]
    }
  },
  mt: {
    c1: {
      passage: `Consultation can reveal problems that a short observation period misses. A crossing that appears safe during the morning commute may be difficult for older residents later in the day, while a bus lane may work differently when school traffic is heavy. Residents who walk, cycle, use mobility aids or rely on public transport can identify these patterns because they experience the street under different conditions.\n\nA careful pilot therefore records more than vehicle speed. Officials might track crossing times, bus reliability, foot traffic near local shops and reports from people who use the route. No single measure captures the whole experience, but several forms of evidence can show whether a change improves access overall. Publishing the results also helps residents understand why a design was retained, revised or withdrawn.`,
      questions: [
        {prompt:'What can consultation reveal that a brief observation might miss?', options:['How the street works for different people at different times.','Whether every vehicle follows the speed limit.','The exact cost of every building nearby.','How to eliminate all school traffic.'], answer:0, explanation:'The passage gives different users and times of day as factors consultation can expose.'},
        {prompt:'Which set of evidence is broader than vehicle speed alone?', options:['Crossing times, bus reliability, foot traffic and user reports.','The colour of road signs and vehicle brands.','Only the number of cars in the morning.','The distance between shops.'], answer:0, explanation:'These are the measures listed in the second paragraph.'},
        {prompt:'True / False / Not Given: The passage claims that one measure can capture the whole street experience.', options:['True','False','Not Given'], answer:1, explanation:'It explicitly says no single measure captures the whole experience.'}

    c2: {
      passage: `Redundancy has a cost, and that cost must be compared with the disruption it can prevent. Maintaining a second route or additional capacity may seem inefficient during ordinary conditions. Yet a network designed only for average demand can fail sharply when a bridge closes or a rail service is interrupted. The relevant calculation includes not only construction and maintenance, but also the economic and social consequences of losing access.\n\nThose consequences are not distributed evenly. People with flexible work, private vehicles or several route options may adapt quickly, while others can lose access to employment, education or medical care. Resilience planning is therefore also a question of fairness. Authorities need to identify critical links, make contingency information accessible and include affected communities in decisions about which risks deserve investment.`,
      questions: [

        {prompt:'Who may be more affected when a transport link fails?', options:['People with few alternative routes or limited flexibility.','People who can work from any location.','People with several private vehicles.','People whose journeys are optional.'], answer:0, explanation:'The passage contrasts flexible travellers with those who may lose essential access.'},
        {prompt:'What does the passage identify as part of resilience planning?', options:['Accessible contingency information and community input.','Using average demand as the only planning measure.','Removing all secondary routes.','Keeping disruption risks confidential.'], answer:0, explanation:'The conclusion calls for accessible information and participation in investment decisions.'}

let readingQuestions = [];
let readingIndex = 0;
let readingCorrect = 0;
let readingAnswered = false;
let readingFinished = false;
function renderReadingQuestion(){
  readingOptions.replaceChildren();
  readingFeedback.textContent = '';
  readingNext.hidden = true;
  if (readingFinished){
    readingProgress.textContent = 'Hoàn thành';
    readingQuestion.textContent = 'Bạn trả lời đúng ' + readingCorrect + '/' + readingQuestions.length + ' câu.';
    readingFeedback.textContent = 'Hãy đọc lại bài và giải thích vì sao các đáp án đúng.';
    readingNext.textContent = 'Làm lại bài đọc';
    readingNext.hidden = false;
    return;
  }
  const item = readingQuestions[readingIndex];
  if (!item){ readingQuestion.textContent = 'Bài đọc này chưa có câu hỏi.'; readingProgress.textContent = ''; return; }
  readingProgress.textContent = 'Câu ' + (readingIndex + 1) + '/' + readingQuestions.length + ' · đúng ' + readingCorrect;
  readingQuestion.textContent = item.prompt;
  item.options.forEach((label, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.addEventListener('click', () => {
      if (readingAnswered) return;
      readingAnswered = true;
      const correct = index === item.answer;
      if (correct) readingCorrect++;
      readingOptions.querySelectorAll('button').forEach((option, optionIndex) => {
        option.disabled = true;
        if (optionIndex === item.answer) option.classList.add('correct');
      });
      if (!correct) button.classList.add('incorrect');
      readingFeedback.textContent = (correct ? 'Chính xác. ' : 'Chưa đúng. ') + item.explanation;
      readingProgress.textContent = 'Câu ' + (readingIndex + 1) + '/' + readingQuestions.length + ' · đúng ' + readingCorrect;
      readingNext.textContent = readingIndex === readingQuestions.length - 1 ? 'Xem kết quả' : 'Câu tiếp theo';
      readingNext.hidden = false;
    });
    readingOptions.appendChild(button);
  });
}
function loadReading(){
  const topic = TOPICS.find(item => item.id === readingUnit.value);
  const baseText = READING_LIBRARY[readingUnit.value] && READING_LIBRARY[readingUnit.value][readingLevel.value];
  const extension = READING_EXTENSIONS[readingUnit.value] && READING_EXTENSIONS[readingUnit.value][readingLevel.value];
  const text = baseText && extension ? {
    ...baseText,
    passage: baseText.passage + '\n\n' + extension.passage,
    questions: baseText.questions.concat(extension.questions)
  } : baseText;
  document.getElementById('reading-unit-title').textContent = topic ? topic.name : '';
  document.getElementById('reading-level-label').textContent = readingLevel.value.toUpperCase() + ' · Đọc bài và chọn đáp án phù hợp';
  readingTitle.textContent = text ? text.title : 'Chưa có bài đọc';
  readingPassage.replaceChildren();
  if (text) text.passage.split(/\n\s*\n/).forEach(paragraph => {
    const element = document.createElement('p');
    element.textContent = paragraph;
    readingPassage.appendChild(element);
  });
  readingQuestions = text ? text.questions : [];
  readingIndex = 0;
  readingCorrect = 0;
  readingAnswered = false;
  readingFinished = false;
  renderReadingQuestion();
}
readingNext.addEventListener('click', () => {
  if (readingFinished){ loadReading(); return; }
  if (!readingAnswered) return;
  if (readingIndex === readingQuestions.length - 1) readingFinished = true;
  else readingIndex++;
  readingAnswered = false;
  renderReadingQuestion();
});
readingLevel.addEventListener('change', loadReading);
studyUnit.addEventListener('change', () => setTopic(studyUnit.value));
readingUnit.addEventListener('change', () => setTopic(readingUnit.value));
setTopic(current);
</script>
